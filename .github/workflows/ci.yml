name: CI Verification Mesh

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-mock ruff
        # Install any other requirements if available
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: ShellCheck
      run: |
        sudo apt-get update && sudo apt-get install -y shellcheck
        find . -name "*.sh" -type f -exec shellcheck {} +
        if [ -f "fwe" ]; then
          first_line=$(head -n 1 "fwe" || true)
          if echo "$first_line" | grep -qE '^#!.*\\b(sh|bash)\\b'; then
            shellcheck fwe
          fi
        fi

    - name: Lint with Ruff / Flake8
      run: |
        # Check Python files
        ruff check .
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Security Gates (Permissions & Credentials)
      run: |
        # Check permissions on shell scripts
        find . -name "*.sh" -type f ! -executable -exec echo "Error: {} is not executable" \; -exec false \;
        if [ -f "fwe" ] && [ ! -x "fwe" ]; then echo "Error: fwe is not executable"; /bin/false; fi

        # Simple regex for hardcoded credentials (very basic check)
        if grep -r -i -E "password\s*=\s*['\"][^'\"]+['\"]" --exclude-dir=.git . ; then
          echo "Possible hardcoded credentials found!"
          /bin/false
        fi

    - name: Test with pytest
      run: |
        if [ -d "tests" ] || ls test_*.py *_test.py test.py >/dev/null 2>&1; then
          pytest
        else
          echo "No pytest tests found."
        fi
