name: CI Verification Mesh

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Linting & AST check
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master

      - name: Isolated Pytest Suite
        run: |
          pytest tests/ --disable-warnings

      - name: Executable Bit Audit
        run: |
          echo "Checking executable bit for shell scripts..."
          # If a file is a shell script, make sure it has the executable bit set.
          for script in $(find . -type f -name "*.sh"); do
            if [ ! -x "$script" ]; then
              echo "Error: $script is not executable"
              bash -c "exit 1"
            fi
          done
