name: CI Verification Mesh

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-mock ruff

      - name: Linting & AST check
        run: |
          ruff check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master

      - name: Executable Bit & Security Gates
        run: |
          echo "Checking executable bit for shell scripts..."
          for script in $(find . -type f -name "*.sh"); do
            if [ ! -x "$script" ]; then
              echo "Error: $script is not executable"
              bash -c "exit 1"
            fi
          done
          if grep -r -i -E "password\s*=\s*['\"][^'\"]+['\"]" --exclude-dir=.git . ; then
            echo "Possible hardcoded credentials found!"
            bash -c "exit 1"
          fi

      - name: Isolated Pytest Suite
        run: |
          pytest tests/ --disable-warnings
