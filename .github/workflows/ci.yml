name: CI Verification Mesh

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-mock ruff
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        ignore_paths: "fwe"

    - name: Lint with Ruff / Flake8
      run: |
        ruff check .
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Security Gates (Permissions & Credentials)
      run: |
        echo "Checking executable bit for shell scripts..."
        find . -name "*.sh" -type f ! -executable -exec echo "Error: {} is not executable" \; -exec false \;
        if [ -f "fwe" ] && [ ! -x "fwe" ]; then echo "Error: fwe is not executable"; /bin/false; fi

        if grep -r -i -E "password\s*=\s*['\"][^'\"]+['\"]" --exclude-dir=.git . ; then
          echo "Possible hardcoded credentials found!"
          /bin/false
        fi

    - name: Test with pytest
      run: |
        if [ -d "tests" ] || ls test_*.py *_test.py test.py >/dev/null 2>&1; then
          pytest --disable-warnings
        else
          echo "No pytest tests found."
        fi
